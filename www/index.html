<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0d13">
<title>Fuse: One Tap Chain</title>
<style>
:root {
  --bg: #0e0d13; --bg2: #17151f; --card: #1f1c2a; --card2: #282436; --line: #34304a;
  --text: #f4f1ea; --dim: #a39fb5; --faint: #6c6884;
  --ember: #ff8a1f; --ember2: #ffb347; --hot: #ff4d2e; --good: #3ddc84; --warn: #ffd166; --bad: #ff5c6c;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --banner: 0px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column;
  padding: calc(var(--sat) + 10px) 16px calc(var(--sab) + var(--banner) + 12px); }
.screen.on { display: flex; animation: fadein .22s ease-out; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; }
.center { text-align: center; }

/* Home */
.logo { font-size: 64px; font-weight: 900; letter-spacing: 6px; line-height: 1; margin: 18px 0 2px;
  background: linear-gradient(180deg, #ffe08a 0%, var(--ember) 50%, var(--hot) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 18px rgba(255,120,30,.35)); }
.tag { color: var(--dim); font-size: 14px; letter-spacing: .5px; }
.chips { display: flex; gap: 8px; justify-content: center; margin: 14px 0 6px; }
.chip { background: var(--card); border: 1px solid var(--line); padding: 7px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; }
.card { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px; margin-top: 12px; text-align: left; width: 100%; display: block; }
.card:active { transform: scale(.985); }
.card h3 { margin: 0 0 4px; font-size: 20px; }
.card p { margin: 0; color: var(--dim); font-size: 14px; }
.card.hero { border-color: rgba(255,138,31,.55); box-shadow: 0 0 0 1px rgba(255,138,31,.15), 0 10px 40px rgba(255,100,20,.15); }
.card .cta { float: right; background: var(--ember); color: #1a0e00; font-weight: 800; padding: 8px 14px; border-radius: 12px; margin-top: 4px; }
.card .cta.done { background: var(--card2); color: var(--good); border: 1px solid var(--line); }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
.tile-btn { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 4px; font-size: 12px; color: var(--dim); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tile-btn b { font-size: 22px; color: var(--text); }
.scroll { overflow-y: auto; flex: 1; margin: 0 -16px; padding: 0 16px; }

/* Game */
.topbar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.iconbtn { width: 44px; height: 44px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 20px; display: grid; place-items: center; }
.title { font-weight: 800; font-size: 18px; }
.sub { color: var(--dim); font-size: 13px; }
.hud { display: flex; justify-content: space-around; margin: 10px 0 4px; }
.hud div { text-align: center; }
.hud b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
.hud span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
.board-wrap { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
canvas.board { display: block; touch-action: none; }
.hint { color: var(--dim); text-align: center; font-size: 14px; min-height: 22px; margin: 6px 0; }
.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn { background: var(--card2); border: 1px solid var(--line); padding: 14px 18px; border-radius: 16px; font-weight: 800; font-size: 16px; min-width: 120px; }
.btn.primary { background: linear-gradient(180deg, var(--ember2), var(--ember)); color: #1a0e00; border: 0; box-shadow: 0 6px 24px rgba(255,120,30,.35); }
.btn.ad::before { content: "▶ "; font-size: 12px; opacity: .8; }
.btn:disabled { opacity: .35; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn.small { padding: 10px 12px; font-size: 14px; min-width: 0; }

/* Sheet */
.sheet-back { position: fixed; inset: 0; background: rgba(5,4,10,.6); display: none; z-index: 20; }
.sheet-back.on { display: block; animation: fadein .2s; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg2); border-top: 1px solid var(--line);
  border-radius: 24px 24px 0 0; padding: 18px 18px calc(var(--sab) + var(--banner) + 18px); transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.9,.3,1); max-height: 88vh; overflow-y: auto; }
.sheet.on { transform: none; }
.big { font-size: 56px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: 22px; color: var(--dim); font-weight: 700; }
.badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-weight: 800; font-size: 13px; }
.badge.perfect { background: rgba(61,220,132,.15); color: var(--good); }
.badge.close { background: rgba(255,209,102,.15); color: var(--warn); }
.badge.far { background: rgba(255,92,108,.15); color: var(--bad); }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.stat b { font-size: 24px; display: block; }
.stat span { font-size: 12px; color: var(--dim); }

/* Map */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
.cal .dow { font-size: 11px; color: var(--faint); text-align: center; }
.cal .day { aspect-ratio: 1; border-radius: 10px; background: var(--card); border: 1px solid var(--line); position: relative; overflow: hidden; display: grid; place-items: center; font-size: 11px; color: var(--faint); }
.cal .day canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cal .day.missed { border-style: dashed; color: var(--bad); }
.cal .day.today { border-color: var(--ember); color: var(--ember); }
.cal .day.future { opacity: .35; }
.cal .day.g { box-shadow: inset 0 0 0 2px var(--good); }
.cal .day.y { box-shadow: inset 0 0 0 2px var(--warn); }
.cal .day.r { box-shadow: inset 0 0 0 2px var(--bad); }
.cal .day .n { position: absolute; top: 2px; left: 4px; font-size: 9px; z-index: 2; color: var(--dim); }

/* Toast / modal */
.toast { position: fixed; left: 50%; top: calc(var(--sat) + 14px); transform: translate(-50%, -150%); background: var(--card2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 14px; z-index: 40; transition: transform .25s; font-weight: 700; font-size: 14px; max-width: 90vw; text-align: center; }
.toast.on { transform: translate(-50%, 0); }
.setting { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); }
.switch { width: 50px; height: 30px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .2s; }
.switch.on { background: var(--ember); }
.switch.on::after { left: 23px; }
.legend { display: grid; grid-template-columns: 40px 1fr; gap: 10px 12px; align-items: center; margin: 12px 0; font-size: 14px; color: var(--dim); }
.legend canvas { width: 40px; height: 40px; }
h2 { margin: 6px 0 4px; }
a { color: var(--ember2); }
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet-back" id="sheetBack"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
